<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap">
  <style>
    body { font-family: 'Roboto', Arial, sans-serif; background: #f7f7f7; margin: 0; }
    .container { max-width: 700px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 16px rgba(0,0,0,0.08); padding: 2rem; }
    h1 { color: #ff6b35; margin-bottom: 1.5rem; }
    .section { margin-bottom: 2rem; }
    label { font-weight: 700; display: block; margin-bottom: 0.5rem; }
    input, textarea, select { width: 100%; padding: 0.5rem; margin-bottom: 1rem; border-radius: 4px; border: 1px solid #ddd; }
    button { background: #ff6b35; color: #fff; border: none; padding: 0.7rem 1.5rem; border-radius: 4px; font-weight: 700; cursor: pointer; margin-right: 0.5rem; }
    .list { margin-bottom: 1rem; }
    .list-item { background: #f3f3f3; padding: 0.7rem; border-radius: 4px; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; }
    .danger { background: #e74c3c; }
    .hidden { display: none; }
    .auth { text-align: center; margin-top: 80px; }
    .auth input { max-width: 220px; }
  </style>
</head>
<body>
  <div id="auth" class="auth">
    <h2>Admin Login</h2>
    <input type="password" id="adminPass" placeholder="Enter admin password" />
    <br>
    <button onclick="loginAdmin()">Login</button>
    <div id="authError" style="color:#e74c3c;margin-top:1rem;"></div>
  </div>
  <div id="adminPanel" class="container hidden">
    <h1>Admin Dashboard</h1>
    <div class="section">
      <h2>Categories Management</h2>
      <div id="categoriesList" class="list"></div>
      <label for="newCategory">Add New Category</label>
      <input type="text" id="newCategory" placeholder="Category name" />
      <button onclick="addCategory()">Add Category</button>
    </div>
    <div class="section">
      <h2>Menu Management</h2>
      <div id="menuList" class="list"></div>
      <label for="newMenuName">Add New Menu Item</label>
      <input type="text" id="newMenuName" placeholder="Menu item name" />
      <input type="number" id="newMenuPrice" placeholder="Price (in paise)" />
      <select id="newMenuCategory"></select>
      <button onclick="addMenuItem()">Add Menu Item</button>
    </div>
  </div>
  <script>
    // Simple hardcoded password for demo
    const ADMIN_PASSWORD = 'admin123';
    function loginAdmin() {
      const pass = document.getElementById('adminPass').value;
      if (pass === ADMIN_PASSWORD) {
        document.getElementById('auth').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
        loadCategories();
        loadMenu();
      } else {
        document.getElementById('authError').textContent = 'Incorrect password.';
      }
    }
    // Categories management
    function loadCategories() {
      fetch('categories.json').then(res => res.json()).then(data => {
        const list = document.getElementById('categoriesList');
        list.innerHTML = '';
        data.forEach((cat, idx) => {
          const div = document.createElement('div');
          div.className = 'list-item';
          div.innerHTML = `<span>${cat.label}</span><button class='danger' onclick='deleteCategory(${idx})'>Delete</button>`;
          list.appendChild(div);
        });
        // Fill category select for menu
        const select = document.getElementById('newMenuCategory');
        select.innerHTML = '';
        data.forEach(cat => {
          const opt = document.createElement('option');
          opt.value = cat.key;
          opt.textContent = cat.label;
          select.appendChild(opt);
        });
      });
    }
    function addCategory() {
      const name = document.getElementById('newCategory').value.trim();
      if (!name) return;
      fetch('categories.json').then(res => res.json()).then(data => {
        data.push({ key: name.toLowerCase().replace(/\s+/g, '-'), label: name });
        saveJSON('categories.json', data, loadCategories);
        document.getElementById('newCategory').value = '';
      });
    }
    function deleteCategory(idx) {
      fetch('categories.json').then(res => res.json()).then(data => {
        data.splice(idx, 1);
        saveJSON('categories.json', data, loadCategories);
      });
    }
    // Menu management
    function loadMenu() {
      fetch('menu.json').then(res => res.json()).then(data => {
        const list = document.getElementById('menuList');
        list.innerHTML = '';
        data.forEach((item, idx) => {
          const div = document.createElement('div');
          div.className = 'list-item';
          div.innerHTML = `<span>${item.name} (₹${(item.price/100).toFixed(2)})</span><button class='danger' onclick='deleteMenuItem(${idx})'>Delete</button>`;
          list.appendChild(div);
        });
      });
    }
    function addMenuItem() {
      const name = document.getElementById('newMenuName').value.trim();
      const price = parseInt(document.getElementById('newMenuPrice').value, 10);
      const category = document.getElementById('newMenuCategory').value;
      if (!name || isNaN(price) || !category) return;
      fetch('menu.json').then(res => res.json()).then(data => {
        data.push({ id: Date.now(), name, price, category });
        saveJSON('menu.json', data, loadMenu);
        document.getElementById('newMenuName').value = '';
        document.getElementById('newMenuPrice').value = '';
      });
    }
    function deleteMenuItem(idx) {
      fetch('menu.json').then(res => res.json()).then(data => {
        data.splice(idx, 1);
        saveJSON('menu.json', data, loadMenu);
      });
    }
    // Save JSON helper (requires server-side support for writing files)
    function saveJSON(file, data, cb) {
      fetch(`/api/save-json`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ file, data })
      }).then(res => {
        if (res.ok) cb();
        else alert('Failed to save data.');
      });
    }
  </script>
</body>
</html>
